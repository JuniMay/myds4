[package]
name = "myds4-server"
version = "0.1.0"
edition = "2024"
description = "myds4's HTTP server on deepseek-recipe, over the C and Metal engine of src/engine.h"
publish = false

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
data-url = "0.3"
deepseek-recipe = "=0.2.0"
deepseek-recipe-core = "=0.2.0"
deepseek-recipe-encoding = "=0.2.0"
# The connections and their limits (http.rs): hyper's HTTP/1 server under axum.
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-graceful", "service", "tokio"] }
# The live view asks the terminal for its background (poll and read on stdin).
libc = "0.2"
rand = "0.9"
# The live view (--tui): ratatui on its crossterm backend; the engine's
# snapshot is JSON.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON in prompts keeps the request's key order, as Python's
# json does; float_roundtrip: numbers parse as C's strtod parses them.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
unicode-width = "0.2"
